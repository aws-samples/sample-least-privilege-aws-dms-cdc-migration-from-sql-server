AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates AWS Secrets Manager secrets and IAM role for AWS DMS
  non-sysadmin SQL Server CDC replication.

Parameters:
  DMSUsername:
    Type: String
    Default: dmsnosysadmin
    Description: DMS SQL Server login name
  DMSPassword:
    Type: String
    NoEcho: true
    Description: DMS SQL Server login password
  SQLServerHost:
    Type: String
    Description: SQL Server hostname or AG listener DNS name
  SQLServerPort:
    Type: Number
    Default: 1433
    Description: SQL Server port
  CertPassword1:
    Type: String
    NoEcho: true
    Description: Encryption password for rtm_dump_dblog certificate
  CertPassword2:
    Type: String
    NoEcho: true
    Description: Encryption password for rtm_position certificate

Resources:

  DMSSecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer managed key for DMS SQL Server non-sysadmin secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  DMSSecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/dms-sqlserver-nonsysadmin-secrets
      TargetKeyId: !Ref DMSSecretsKMSKey

  DMSEndpointCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dms/sqlserver/endpoint-credentials
      Description: DMS source endpoint credentials for SQL Server
      KmsKeyId: !Ref DMSSecretsKMSKey
      SecretString: !Sub |
        {
          "username": "${DMSUsername}",
          "password": "${DMSPassword}",
          "engine": "sqlserver",
          "host": "${SQLServerHost}",
          "port": ${SQLServerPort},
          "dbname": "master"
        }

  DMSCertPasswords:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dms/sqlserver/cert-passwords
      Description: Certificate encryption passwords for non-sysadmin setup
      KmsKeyId: !Ref DMSSecretsKMSKey
      SecretString: !Sub |
        {
          "rtm_dump_dblog_cert_password": "${CertPassword1}",
          "rtm_position_cert_password": "${CertPassword2}"
        }

  DMSSecretsManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dms-secrets-manager-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: dms.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dms-secrets-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DMSEndpointCredentials
                  - !Ref DMSCertPasswords
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DMSSecretsKMSKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

Outputs:
  EndpointCredentialsArn:
    Description: ARN of the DMS endpoint credentials secret
    Value: !Ref DMSEndpointCredentials
    Export:
      Name: !Sub ${AWS::StackName}-EndpointCredentialsArn

  CertPasswordsArn:
    Description: ARN of the certificate passwords secret
    Value: !Ref DMSCertPasswords
    Export:
      Name: !Sub ${AWS::StackName}-CertPasswordsArn

  DMSRoleArn:
    Description: ARN of the IAM role for DMS Secrets Manager access
    Value: !GetAtt DMSSecretsManagerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DMSRoleArn

  SecretsKMSKeyArn:
    Description: ARN of the customer managed KMS key encrypting the secrets
    Value: !GetAtt DMSSecretsKMSKey.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SecretsKMSKeyArn
