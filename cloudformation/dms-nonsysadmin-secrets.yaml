AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  Creates KMS-encrypted AWS Secrets Manager secrets and the regional AWS DMS
  service role for non-sysadmin SQL Server CDC replication.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  DMSUsername:
    Type: String
    Default: dmsnosysadmin
    Description: DMS SQL Server login name
  DMSPassword:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^;+%]+$'
    ConstraintDescription: The DMS endpoint password cannot contain semicolon, plus, or percent characters.
    Description: DMS SQL Server login password; semicolon, plus, and percent are unsupported by AWS DMS endpoints
  SQLServerHost:
    Type: String
    Description: SQL Server hostname or AG listener DNS name
  SQLServerPort:
    Type: Number
    Default: 1433
    MinValue: 1
    MaxValue: 65535
    Description: SQL Server port
  CertPassword:
    Type: String
    NoEcho: true
    Description: Encryption password used for both signed wrapper certificates

Resources:
  DMSSecretsKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Customer managed key for DMS SQL Server non-sysadmin secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  DMSSecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-secrets
      TargetKeyId: !Ref DMSSecretsKMSKey

  DMSEndpointCredentials:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Supplies only the SQL Server endpoint credentials that AWS DMS retrieves at task startup.
        must:
          - Remain encrypted with the stack customer managed KMS key.
          - Keep the username and password out of endpoint definitions.
    Properties:
      Name: !Sub ${AWS::StackName}/endpoint-credentials
      Description: DMS source endpoint credentials for SQL Server
      KmsKeyId: !Ref DMSSecretsKMSKey
      SecretString:
        Fn::ToJsonString:
          username: !Ref DMSUsername
          password: !Ref DMSPassword
          engine: sqlserver
          host: !Ref SQLServerHost
          port: !Ref SQLServerPort
          dbname: master

  DMSCertPassword:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the operator-retrieved password used to encrypt and re-sign both SQL Server wrapper certificates.
        must:
          - Never be readable by the AWS DMS service role.
          - Remain encrypted with the stack customer managed KMS key.
    Properties:
      Name: !Sub ${AWS::StackName}/certificate-password
      Description: Certificate encryption password for the non-sysadmin setup
      KmsKeyId: !Ref DMSSecretsKMSKey
      SecretString:
        Fn::ToJsonString:
          certificate_password: !Ref CertPassword

  DMSSecretsManagerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows AWS DMS to retrieve the SQL Server endpoint secret through Secrets Manager.
        must:
          - Trust both the global and Region-specific AWS DMS service principals.
          - Read only the endpoint credential secret, not the certificate password secret.
          - Decrypt only through the regional Secrets Manager service.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - dms.amazonaws.com
                - !Sub dms.${AWS::Region}.${AWS::URLSuffix}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dms-endpoint-secret-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DMSEndpointCredentials
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DMSSecretsKMSKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}

Outputs:
  EndpointCredentialsArn:
    Description: ARN of the DMS endpoint credentials secret
    Value: !Ref DMSEndpointCredentials
    Export:
      Name: !Sub ${AWS::StackName}-EndpointCredentialsArn

  CertPasswordArn:
    Description: ARN of the certificate password secret for the SQL operator
    Value: !Ref DMSCertPassword
    Export:
      Name: !Sub ${AWS::StackName}-CertPasswordArn

  DMSRoleArn:
    Description: ARN of the IAM role for DMS Secrets Manager access
    Value: !GetAtt DMSSecretsManagerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DMSRoleArn

  SecretsKMSKeyArn:
    Description: ARN of the customer managed KMS key encrypting the secrets
    Value: !GetAtt DMSSecretsKMSKey.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SecretsKMSKeyArn
